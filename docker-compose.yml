services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: alpha-clickhouse
    ports:
      - "127.0.0.1:${CLICKHOUSE_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-alpha}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-alpha}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./config/clickhouse/zz-disable-heavy-logs.xml:/etc/clickhouse-server/config.d/zz-disable-heavy-logs.xml:ro
      - ./config/clickhouse/zz-memory-caps.xml:/etc/clickhouse-server/config.d/zz-memory-caps.xml:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: alpha-qdrant
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # qdrant image ships no curl/wget; use bash's /dev/tcp probe
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  clickhouse_data:
  qdrant_data:
